schema_version: "0.1"

harness:
  repository: gharbonnier78/scientific-research-harness
  ref: "e80097fe8eb88c9e9340732683710ba1dc2ae008"
  entrypoint: HARNESS.md
  status: "adopted_reviewed_merge_ref"
  upgrade_rule: "Adopt future harness changes only through an explicit immutable merge/tag/commit ref; never follow main silently."

consumer:
  repository: "gharbonnier78/mmals-ml-wiki"
  project_id: "diderot-mmals-ml"
  instruction_entrypoints:
    - AGENTS.md
    - CLAUDE.md

  canonical_pedagogy_surfaces:
    - concepts/
    - labs/
    - pathways/
    - mathematics/notation/registry.json
    - docs/harness-meta.md

authority:
  sources:
    - id: "diderot-source-registry"
      reference: "research/sources/"
      role: "Per-entry source provenance for research-derived statements."
    - id: "notation-entry-authority"
      reference: "mathematics/notation/registry.json#entries[].authority"
      role: "Per-notation mathematical source/provenance; must be populated to the evidence level available for the entry."
    - id: "repository-outcome-authority"
      reference: "data/repository-outcomes.json#repositories[].outcome.source_url"
      role: "Per-repository source artifact that supports the bounded outcome/status wording shown in the public atlas."
  domain_experts: []
  prohibited_substitution:
    - "The harness, Diderot, ChatGPT and Claude do not replace authoritative mathematical/scientific sources or accountable human review."

artifacts:
  claims:
    - data/concepts.json
    - data/repository-outcomes.json
    - research/
  evidence:
    - data/evidence.json
    - research/provenance/
  scientific_gates: []
  chronicle:
    - research/chronicle/
  pedagogy:
    - concepts/
    - labs/
    - pathways/
    - mathematics/notation/registry.json
  handoff: "research/chronicle/2026-09-01--belief-sufficiency-adaptive-planning-startup.md"

execution:
  environment_lock: null
  engineering:
    care_profile: "MVP"
    rationale: "Diderot is a public static teaching site with executable browser interactions. It has no account, secret-bearing backend or mutable server-side state, but browser behavior, link integrity, mathematical rendering and provenance surfaces are decision-relevant."
    required_checks:
      - "python scripts/prepare_pages.py"
      - "python scripts/check_render_contract.py"
      - "python scripts/check_internal_links.py"
      - "python scripts/check_notation_registry.py"
      - "python scripts/check_release_consistency.py"
      - "python scripts/check_concept_audit.py"
      - "python scripts/check_repository_atlas.py"
      - "npm run test:browser"
  replay_commands:
    - "python scripts/prepare_pages.py"
    - "python scripts/check_render_contract.py"
    - "python scripts/check_internal_links.py"
    - "python scripts/check_notation_registry.py"
    - "python scripts/check_release_consistency.py"
    - "python scripts/check_concept_audit.py"
    - "python scripts/check_repository_atlas.py"
    - "npm run test:browser"
  randomness:
    status: "not_applicable"
    root_entropy_policy: null
    lineage_artifact: null
  concurrency:
    status: "not_applicable"
    reference_path: null
    equivalence_evidence: null

local_extensions:
  - "docs/authoring-guide.md"
  - "mathematics/notation/README.md"

deviations: []

adoption:
  adopted_at: "2026-08-30"
  adopted_by: "ChatGPT with explicit user authorization"
  notes: "Initial provisional pin to harness PR #18 was upgraded after independent review and merge. The current ref is the immutable reviewed merge commit after PR #19, which clarified the single-canonical-registry rule and concept/notation orchestration. The repository outcome atlas is a curated claim/status index whose entries point back to repository-owned source artifacts; it is not itself scientific evidence. On 2026-09-01 the public-site engineering profile was made explicit as MVP before adding the belief/sufficiency/adaptive-planning teaching path and browser-level interaction checks."
