name: Browser smoke
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  belief-adaptive-planning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-browser.txt
      - name: Install pinned browser runner
        run: python -m pip install -r requirements-browser.txt
      - name: Install Chromium and system dependencies
        run: python -m playwright install --with-deps chromium
      - name: Prepare rendered Pages artifact
        run: python scripts/prepare_pages.py
      - name: Execute public interaction like a user
        run: python tests/browser/run_belief_adaptive_planning_browser.py
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: belief-adaptive-planning-browser-evidence
          path: test-artifacts/
          if-no-files-found: warn
