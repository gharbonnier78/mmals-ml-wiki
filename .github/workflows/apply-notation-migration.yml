name: Apply notation migration
on:
  push:
    branches: [agent/belief-sufficiency-adaptive-planning]
permissions:
  contents: write
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[notation-migration]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/belief-sufficiency-adaptive-planning
          fetch-depth: 0
      - name: Apply idempotent canonical-registry migration
        run: python scripts/capitalize_adaptive_decision_notation.py
      - name: Validate notation registry before commit
        run: python scripts/check_notation_registry.py
      - name: Commit generated canonical registry when changed
        shell: bash
        run: |
          if git diff --quiet -- mathematics/notation/registry.json; then
            echo "Canonical notation registry already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mathematics/notation/registry.json
          git commit -m "pedagogy: capitalize adaptive-decision notation [notation-migration]"
          git push origin HEAD:agent/belief-sufficiency-adaptive-planning
